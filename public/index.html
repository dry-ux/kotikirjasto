<!doctype html>
<html lang="fi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Kotikirjasto</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <main>
      <h1>📚 Kotikirjasto</h1>
      <p class="tagline">Keskustele omasta kirjastoistasi ja rakenna niiden metatietokantaa.</p>

      <section class="panel">
        <h2>Keskustelu</h2>
        <div id="chat-log" aria-live="polite"></div>
        <form id="chat-form">
          <input id="chat-input" type="text" placeholder="Kysy kirjasta, kirjailijasta tai kokoelman järjestämisestä…" autocomplete="off" required />
          <button type="submit">Lähetä</button>
        </form>
      </section>

      <section class="panel">
        <h2>Hae verkosta</h2>
        <p class="hint">Hakee tiedot <strong>Fennicasta</strong> (Kansalliskirjasto), Open Librariesta ja Google Booksesta.</p>
        <form id="lookup-form">
          <input id="lookup-input" type="text" placeholder="ISBN tai kirjan nimi ja tekijä" autocomplete="off" required />
          <button type="submit">Hae tiedot verkosta</button>
        </form>
        <div id="lookup-result"></div>
      </section>

      <section class="panel">
        <h2>Lisää kirja</h2>
        <form id="book-form">
          <textarea id="book-input" rows="3" placeholder="Liitä kirjan kuvaus tai takakansi, tai kirjoita mitä muistat: 'Pride and Prejudice, Austen, 1813, suosikkikopioni'"></textarea>
          <button type="submit">Poimi tiedot &amp; tallenna</button>
        </form>
        <div id="book-result"></div>
      </section>

      <section class="panel">
        <h2>Kokoelma <span id="book-count"></span></h2>
        <p class="hint">Klikkaa kirjan nimeä muokataksesi tai poistaaksesi sen.</p>
        <ul id="book-list"></ul>
        <div id="edit-area"></div>
      </section>
    </main>
    <script src="app.js"></script>
  </body>
</html>
